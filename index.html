<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>BoardLink — play chess on your own boards</title>
    <meta
      name="description"
      content="Use your own chessboards. BoardLink simply passes each move between you."
    />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The board is the first thing on screen; fetch it with the document. -->
    <link
      rel="preload"
      as="image"
      href="/vendor/lichess/board/brown.png"
      fetchpriority="high"
    />

    <!--
      Render-blocking on purpose: the theme must be on <html> before the first
      paint. External rather than inline because the production CSP is
      `script-src 'self'`, which blocks inline scripts.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-background text-foreground">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
